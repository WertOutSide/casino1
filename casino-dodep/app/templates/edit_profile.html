{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card casino-card">
                <div class="card-header bg-dark text-white">
                    <h2 class="mb-0">Edit Profile</h2>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for("profile.edit_profile") }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ current_user.name }}" required>
                        </div>

                        <button type="submit" class="btn btn-success">Сохранить</button>
                        <a href="{{ url_for("profile.profile") }}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
