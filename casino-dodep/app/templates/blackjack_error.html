{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Error</h2>
    <div style="color: #ff6b6b; background: #2d1a1a; padding: 15px; border-radius: 5px; margin: 10px 0;">
        <h3>Error Code: {{ error_code }}</h3>
        <p>{{ error_message }}</p>
    </div>
    
    <p>Your current balance: ${{ balance }}</p>
    
    <div style="margin-top: 20px;">
        <a href="{{ url_for('bj.blackjack') }}"><button>Return to Blackjack</button></a>
        <a href="{{ url_for('index') }}"><button>Return to Home</button></a>
    </div>
</div>
{% endblock %}
